version: '3.8'

services:
  api:
    build: 
      context: . # Assumes this file is inside the backend/ folder
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Syncs your local code changes immediately without rebuilding
    environment:
      - DATABASE_URL=postgresql://admin:secret123@db:5432/acetone_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=acetone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: