services:
  backend:
    build:
      context: ../backend
    container_name: acetone-backend
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - neo4j

  postgres:
    image: postgres:16-alpine
    container_name: acetone-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acetone}
      POSTGRES_USER: ${POSTGRES_USER:-acetone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acetone}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: acetone-redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    container_name: acetone-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/acetonepassword}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
